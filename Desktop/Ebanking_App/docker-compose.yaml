version: '3.8'

services:
  # Service PHP + Apache
  app:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_NAME=ebanking_db
      - DB_USER=user_bank
      - DB_PASS=bank_password

  # Service Base de données
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: ebanking_db
      MYSQL_USER: user_bank
      MYSQL_PASSWORD: bank_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  db_data: